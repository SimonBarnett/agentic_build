name: Test-Pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -MinimumVersion 1.21.0 -AllowClobber -Repository PSGallery

      - name: Run Test-Pack (offline gate)
        shell: powershell
        run: |
          & "${{ github.workspace }}/tools/Test-Pack.ps1" -RepoRoot "${{ github.workspace }}"
